<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen Financiero - Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark navbar-custom navbar-expand-lg">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <span class="navbar-brand mb-0 h1">⚽ Dashboard de Gestión</span>
        <div class="d-flex gap-2">
            <a href="/" class="btn btn-outline-light btn-sm fw-bold">⬅️ Volver a Socios</a>
            <a href="/configuracion" class="btn btn-warning btn-sm fw-bold text-white">⚙️ Configuración</a>
            <a href="/deudores" class="btn btn-danger btn-sm fw-bold">Ver Deudores</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row mb-4">
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm border-primary h-100">
                <div class="card-body text-center d-flex flex-column justify-content-center">
                    <h5 class="text-muted small text-uppercase fw-bold mb-3">Socios Activos</h5>
                    <h2 class="display-5 fw-bold text-primary mb-0">{{ socios }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm border-success h-100">
                <div class="card-body text-center d-flex flex-column justify-content-center">
                    <h5 class="text-muted small text-uppercase fw-bold mb-3">Recaudación Anual ({{ anio }})</h5>
                    <h2 class="display-5 fw-bold text-success mb-0">${{ recaudacion }}</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header fw-bold">
            📈 Evolución de Ingresos Mensuales
        </div>
        <div class="card-body">
            <div style="height: 350px;">
                <canvas id="graficoIngresos"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const datosGrafico = JSON.parse('{{ datos | tojson | safe }}');
    
    // Obtenemos los estilos modernos (Cian vibrante) para el gráfico
    const colorPrimario = '#00bcd4';
    const colorHover = '#0097a7';

    const ctx = document.getElementById('graficoIngresos').getContext('2d');
    new Chart(ctx, {
        type: 'bar', 
        data: {
            labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
            datasets: [{
                label: 'Pesos Recaudados ($)',
                data: datosGrafico,
                backgroundColor: colorPrimario, // Color actualizado
                borderRadius: 8, // Bordes más redondeados
                hoverBackgroundColor: colorHover
            }]
        },
        options: {
            maintainAspectRatio: false,
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    suggestedMax: 100000,
                    grid: {
                        color: 'rgba(0,0,0,0.05)' // Líneas de fondo más sutiles
                    },
                    ticks: {
                        callback: function(value) { return '$' + value; },
                        font: { family: "'Poppins', sans-serif" }
                    }
                },
                x: {
                    grid: { display: false }, // Ocultamos las líneas verticales para mayor limpieza
                    ticks: { font: { family: "'Poppins', sans-serif", weight: 500 } }
                }
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: 'rgba(0, 51, 102, 0.9)', // Tooltip con el azul profundo
                    titleFont: { family: "'Poppins', sans-serif" },
                    bodyFont: { family: "'Poppins', sans-serif" },
                    padding: 12,
                    cornerRadius: 8
                }
            }
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
