<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración del Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2.0">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark navbar-custom navbar-expand-lg">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <span class="navbar-brand mb-0 h1">⚙️ Ajustes del Sistema</span>
        <div class="d-flex gap-2">
            <a href="/" class="btn btn-outline-light btn-sm fw-bold">⬅️ Volver a Socios</a>
            <a href="/resumen" class="btn btn-info btn-sm fw-bold text-white">📊 Resumen</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header fw-bold text-center">
                    Configuración General
                </div>
                <div class="card-body p-4">
                    <form action="/guardar_configuracion" method="POST">
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold text-uppercase d-block text-center">Valor de la Cuota Mensual ($)</label>
                            <input type="number" step="0.01" name="precio" class="form-control form-control-lg text-primary fw-bold text-center fs-3" value="{{ precio }}" required>
                            <div class="form-text mt-2 text-center">Este valor se usará para calcular la deuda de los socios morosos automáticamente.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
