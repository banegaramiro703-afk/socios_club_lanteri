<td>
    <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#modalPago{{ socio.id_socio }}">
        Registrar Pago
    </button>
</td>

<div class="modal fade" id="modalPago{{ socio.id_socio }}" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Cobrar a: {{ socio.nombre }} {{ socio.apellido }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form action="/registrar_pago" method="POST">
        <div class="modal-body">
            <input type="hidden" name="id_socio" value="{{ socio.id_socio }}">
            
            <div class="mb-3">
                <label>Monto Total</label>
                <input type="number" name="monto" class="form-control" placeholder="$" required>
            </div>
            
            <div class="row">
                <div class="col">
                    <label>Mes Inicio</label>
                    <select name="mes" class="form-select">
                        <option value="1">Enero</option>
                        <option value="3" selected>Marzo</option> </select>
                </div>
                <div class="col">
                    <label>Año</label>
                    <input type="number" name="anio" class="form-control" value="2026">
                </div>
            </div>

            <div class="mt-3">
                <label>Tipo de Pago</label>
                <select name="tipo" class="form-select">
                    <option value="Mensual">Solo este mes</option>
                    <option value="Anual">Pago Anual (12 meses)</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button type="submit" class="btn btn-success">Confirmar Cobro</button>
        </div>
      </form>
    </div>
  </div>
</div>
